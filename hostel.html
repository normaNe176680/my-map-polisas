<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polisas Hostel Details (360° View)</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>

    <style>
        :root {
            --polisas-red: #e00202;
        }

        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(rgba(0, 0, 0, 0.8), rgba(0, 0, 0, 0.8)), 
                        url('https://images.unsplash.com/photo-1592288333341-37d40a581297?auto=format&fit=crop&q=80&w=1920');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: white;
            padding-bottom: 50px;
        }

        header {
            background: rgba(224, 2, 2, 0.8);
            backdrop-filter: blur(10px);
            padding: 20px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        header h2 {
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 600;
            font-size: 1.8rem;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            background: rgba(255, 255, 255, 0.95);
            color: #333;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
        }

        #panorama-viewer {
            width: 100%;
            height: 480px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            background: #000;
        }

        .room-section {
            margin: 25px 0;
            text-align: left;
        }

        .room-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }

        .room-btn {
            background: #f0f2f5;
            border: 2px solid transparent;
            padding: 10px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.3s;
            font-weight: 600;
            color: #333;
        }

        .room-btn:hover {
            background: #ffe6e6;
            border-color: var(--polisas-red);
        }

        .room-btn.active {
            background: var(--polisas-red);
            color: white;
        }

        .map-btn {
            display: inline-block;
            background: #4285F4; 
            color: white;
            padding: 15px 30px;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            margin: 20px 0;
            transition: 0.3s;
        }

        .map-btn:hover {
            background: #357ae8;
            transform: translateY(-3px);
        }

        .back-link {
            display: block;
            margin-top: 20px;
            color: #666;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>
<body>

<header>
    <h2 id="displayTitle">Hostel Details</h2>
</header>

<div class="container" id="mainContent">
    
    <div id="panorama-viewer"></div>
    
    <h2 id="viewTitle"></h2>
    <p id="viewDesc" style="font-size: 1.1rem; line-height: 1.6; color: #555;"></p>

    <div class="room-section" id="roomSection">
        <h4 style="margin-bottom: 5px; color: var(--polisas-red);">Sila Pilih Bilik / Lokasi Pinpoint:</h4>
        <div class="room-grid" id="roomGrid"></div>
    </div>

    <a id="googleMapsLink" href="#" target="_blank" class="map-btn">
        <i class="fas fa-map-marker-alt"></i> Buka Google Maps
    </a>

    <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">
    <a href="javascript:history.back()" class="back-link"><i class="fas fa-arrow-left"></i> Kembali ke Sub-Kategori</a>
</div>

<script>
    // 1. Ambil parameter ?name= daripada URL
    const urlParams = new URLSearchParams(window.location.search);
    const selectedHostel = urlParams.get("name");

    let myViewer = null;

    // 2. Pangkalan Data Lokasi Kamsis (Lengkap untuk Al-Biruni, Al-Ghazali, dan Ibnu Sina)
    const hostelData = {
        "Kamsis Al-Biruni": {
            image: "image/placeholder_360.jpg", // Jalur fail imej panorama utama anda
            desc: "Blok kediaman Kamsis Al-Biruni menyediakan fasiliti penginapan yang selesa untuk para pelajar POLISAS serta berdekatan dengan kemudahan utama kamsis.",
            mapLink: "https://maps.google.com/?q=Kamsis+Al+Biruni+Polisas", // Sila gantikan URL Google Maps jika perlu
            hotspots: [],
            rooms: {}
        },
        "Kamsis Al-Ghazali": {
            image: "image/bilik_kualiti.jpg",
            desc: "Blok kediaman Kamsis Al-Ghazali menempatkan bilik penginapan pelajar dengan persekitaran yang kondusif untuk mengulangkaji pelajaran.",
            mapLink: "https://maps.google.com/?q=Kamsis+Al+Ghazali+Polisas",
            hotspots: [],
            rooms: {}
        },
        "Kamsis Ibnu Sina": {
            image: "image/hostel_ibnu_sina_360.jpg",
            desc: "Blok kediaman Kamsis Ibnu Sina yang dilengkapi dengan kemudahan asas bersebelahan dengan kawasan rekreasi dan kemudahan kamsis.",
            mapLink: "https://maps.google.com/?q=Kamsis+Ibnu+Sina+Polisas",
            hotspots: [],
            rooms: {}
        }
    };

    // 3. Fungsi menukar pandangan 360 & mengemas kini UI
    function update360View(viewName, imgPath, description, hotspotsList, activeBtnText) {
        document.getElementById("viewTitle").innerText = viewName;
        document.getElementById("viewDesc").innerText = description;

        // Musnahkan viewer sedia ada jika wujud sebelum memuatkan imej baru
        if (myViewer) {
            myViewer.destroy();
        }

        // Setup konfigurasi asas Pannellum
        let viewerConfig = {
            "type": "equirectangular",
            "panorama": imgPath,
            "autoLoad": true,
            "hfov": 110,
            "hotSpots": []
        };

        // Membina sistem penukaran hotspot jika ada targetRoom
        if (hotspotsList) {
            hotspotsList.forEach(hs => {
                viewerConfig.hotSpots.push({
                    "pitch": hs.pitch,
                    "yaw": hs.yaw,
                    "type": "info",
                    "text": hs.text,
                    "clickHandlerFunc": function() {
                        if (hs.targetRoom === "MAIN_VIEW") {
                            document.getElementById("mainViewBtn").click();
                        } else {
                            const buttons = document.querySelectorAll(".room-btn");
                            buttons.forEach(btn => {
                                if (btn.innerText === hs.targetRoom) {
                                    btn.click();
                                }
                            });
                        }
                    }
                });
            });
        }

        myViewer = pannellum.viewer('panorama-viewer', viewerConfig);

        // Kawal keadaan warna aktif butang menu
        const buttons = document.querySelectorAll(".room-btn");
        buttons.forEach(btn => {
            if (btn.innerText === activeBtnText) {
                btn.classList.add("active");
            } else {
                btn.classList.remove("active");
            }
        });
    }

    // 4. Proses memuatkan data permulaan
    if (selectedHostel && hostelData[selectedHostel]) {
        const hostel = hostelData[selectedHostel];

        document.getElementById("displayTitle").innerText = selectedHostel;
        document.getElementById("googleMapsLink").href = hostel.mapLink;

        const roomGrid = document.getElementById("roomGrid");

        // 1. Bina Butang Utama (Main View)
        const mainBtn = document.createElement("button");
        mainBtn.className = "room-btn active";
        mainBtn.id = "mainViewBtn";
        mainBtn.innerText = "Pandangan Utama";
        mainBtn.onclick = function() {
            update360View(selectedHostel, hostel.image, hostel.desc, hostel.hotspots, "Pandangan Utama");
        };
        roomGrid.appendChild(mainBtn);

        // 2. Bina Butang Pilihan Bilik secara dinamik (Jika ada pecahan bilik pada masa akan datang)
        if (hostel.rooms) {
            for (const roomName in hostel.rooms) {
                if (hostel.rooms.hasOwnProperty(roomName)) {
                    const btn = document.createElement("button");
                    btn.className = "room-btn";
                    btn.innerText = roomName;
                    btn.onclick = function() {
                        const room = hostel.rooms[roomName];
                        update360View(roomName, room.img, room.desc, room.hotspots, roomName);
                    };
                    roomGrid.appendChild(btn);
                }
            }
        }

        // Cetus paparan pertama
        mainBtn.click();

    } else {
        document.getElementById("mainContent").innerHTML = `
            <h2>Data Tidak Ditemui</h2>
            <p>Sila pilih lokasi dari menu sub-kategori.</p>
            <a href="explore.html" class="map-btn">Kembali Ke Explore</a>
        `;
    }
</script>

</body>
</html>
