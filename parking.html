<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polisas Parking Details (360° View)</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Pannellum 360 Viewer CSS & JS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>

    <!-- Driver.js CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/driver.js@1.0.1/dist/driver.css"/>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: #f4f6f9;
        }

        header {
            background: #ff0000;
            color: white;
            padding: 30px 20px;
            text-align: center;
        }

        header h2 {
            margin: 0;
            font-size: 24px;
        }

        .container {
            padding: 40px;
            max-width: 900px;
            margin: 0 auto;
            text-align: center;
        }

        #panorama-viewer {
            width: 100%;
            height: 480px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
            background: #000;
        }

        .map-btn {
            display: inline-block;
            background: #4285F4; 
            color: white;
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            margin: 20px 0;
            transition: 0.3s;
        }

        .map-btn:hover {
            background: #357ae8;
        }

        .back-link {
            display: block;
            margin-top: 20px;
            color: #666;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            color: #ff0000;
        }
    </style>
</head>
<body>

<header>
    <h2 id="displayTitle">Parking Details</h2>
</header>

<div class="container" id="mainContent">
    <div id="panorama-viewer"></div>
    
    <h2 id="viewTitle" style="color: #333;"></h2>
    <p id="viewDesc" style="font-size: 1rem; line-height: 1.6; color: #555;"></p>

    <a id="googleMapsLink" href="#" target="_blank" class="map-btn">
        <i class="fa fa-map-marker-alt"></i> Buka Google Maps
    </a>

    <hr style="border: 0; border-top: 1px solid #ddd; margin: 20px 0;">
    <a href="category.html?main=parking" class="back-link"><i class="fa fa-arrow-left"></i> Kembali ke Sub-Kategori</a>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const selectedParking = urlParams.get("name") || "Parkir C (kereta)";

    // Local image paths pointing to image/Parking/(file name)
    const parkingData = {
        "Parking C (kereta)": {
            image: "image/Parking/parkingc.jpg",
            desc: "Kawasan tempat letak kenderaan kereta bagi Zon C untuk kegunaan warga kampus dan pelawat.",
            mapLink: "https://maps.google.com"
        },
        "Parking D (motorsikal)": {
            image: "image/Parking/parkingd.jpg",
            desc: "Kawasan tempat letak motosikal Zon D yang disediakan khas untuk keselesaan dan keselamatan penunggang.",
            mapLink: "https://maps.google.com"
        },
        "Parking C (motorsikal)": {
            image: "image/Parking/parkingcmoto.jpg",
            desc: "Zon meletak motosikal C yang terletak berhampiran blok bangunan utama kampus POLISAS.",
            mapLink: "https://maps.google.com"
        }
    };

    if (parkingData[selectedParking]) {
        const item = parkingData[selectedParking];

        document.getElementById("displayTitle").innerText = selectedParking;
        document.getElementById("viewTitle").innerText = selectedParking;
        document.getElementById("viewDesc").innerText = item.desc;
        document.getElementById("googleMapsLink").href = item.mapLink;

        pannellum.viewer('panorama-viewer', {
            "type": "equirectangular",
            "panorama": item.image,
            "autoLoad": true,
            "hfov": 100
        });
    } else {
        document.getElementById("mainContent").innerHTML = `
            <h2>Data Tidak Ditemui</h2>
            <p>Sila pilih lokasi dari menu sub-kategori.</p>
            <a href="category.html?main=parking" class="map-btn">Kembali Ke Sub-Kategori</a>
        `;
    }
</script>

<!-- Driver.js Library & Custom Guide Script -->
<script src="https://cdn.jsdelivr.net/npm/driver.js@1.0.1/dist/driver.js.iife.js"></script>
<script src="guide.js"></script>

</body>
</html>
