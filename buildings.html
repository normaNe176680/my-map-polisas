    <style>
        :root {
            --polisas-red: #e00202;
        }

        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(rgba(0, 0, 0, 0.8), rgba(0, 0, 0, 0.8)), 
                        url('https://images.unsplash.com/photo-1592288333341-37d40a581297?auto=format&fit=crop&q=80&w=1920');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: white;
            padding-bottom: 50px;
        }

        header {
            background: rgba(224, 2, 2, 0.8);
            backdrop-filter: blur(10px);
            padding: 20px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            background: rgba(255, 255, 255, 0.95);
            color: #333;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
        }

        #panorama-viewer {
            width: 100%;
            height: 480px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            background: #000;
        }

        .room-section {
            margin: 25px 0;
            text-align: left;
        }

        .room-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }

        .room-btn {
            background: #f0f2f5;
            border: 2px solid transparent;
            padding: 10px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.3s;
            font-weight: 600;
            color: #333;
        }

        .room-btn:hover {
            background: #ffe6e6;
            border-color: var(--polisas-red);
        }

        .room-btn.active {
            background: var(--polisas-red);
            color: white;
        }

        .map-btn {
            display: inline-block;
            background: #4285F4; 
            color: white;
            padding: 15px 30px;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            margin: 20px 0;
            transition: 0.3s;
        }

        .map-btn:hover {
            background: #357ae8;
            transform: translateY(-3px);
        }

        .back-link {
            display: block;
            margin-top: 20px;
            color: #666;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>

    // Fungsi selamat untuk kemas kini paparan 360 darjah
    function update360View(title, imgUrl, desc, currentHotspots, roomKeyName) {
        document.getElementById("viewTitle").innerText = title;
        document.getElementById("viewDesc").innerText = desc;

        // Padam viewer lama secara selamat sekiranya wujud
        if (myViewer) {
            try {
                myViewer.destroy();
            } catch(e) {
                console.log("Viewer reset notice:", e);
            }
            myViewer = null;
        }

        // Susun semula senarai titik hotspot
        const formattedHotspots = [];
        if (currentHotspots && Array.isArray(currentHotspots)) {
            currentHotspots.forEach(hp => {
                formattedHotspots.push({
                    "pitch": hp.pitch,
                    "yaw": hp.yaw,
                    "type": "info",
                    "text": hp.text,
                    "clickHandlerFunc": function() {
                        if (hp.targetRoom === "MAIN_VIEW") {
                            const mainBtn = document.getElementById("mainViewBtn");
                            if (mainBtn) mainBtn.click();
                        } else {
                            const allBtns = document.querySelectorAll('.room-btn');
                            allBtns.forEach(btn => {
                                if (btn.innerText.trim() === hp.targetRoom) {
                                    btn.click();
                                }
                            });
                        }
                    }
                });
            });
        }
        

        // Mulakan semula Pannellum dengan parameter yang betul
        myViewer = pannellum.viewer('panorama-viewer', {
            "type": "equirectangular",
            "panorama": imgUrl,
            "autoLoad": true,
            "hfov": 100,
            "hotspots": formattedHotspots
        });

        // Kemas kini gaya butang aktif
        document.querySelectorAll('.room-btn').forEach(b => b.classList.remove('active'));
        const activeBtn = Array.from(document.querySelectorAll('.room-btn')).find(b => b.innerText.trim() === roomKeyName);
        if (activeBtn) activeBtn.classList.add('active');
    }

    // Memulakan pembinaan antara muka (Interface Setup)
    if (selectedBuilding && buildingData[selectedBuilding]) {
        const building = buildingData[selectedBuilding];
        document.getElementById("displayTitle").innerText = selectedBuilding;
        document.getElementById("googleMapsLink").href = building.mapLink;

        const roomGrid = document.getElementById("roomGrid");
        roomGrid.innerHTML = ""; // Bersihkan Grid

        // 1. Bina Butang Utama (Main View)
        const mainBtn = document.createElement("button");
        mainBtn.className = "room-btn active";
        mainBtn.id = "mainViewBtn";
        mainBtn.innerText = "Pandangan Utama";
        mainBtn.onclick = function() {
            update360View(selectedBuilding, building.image, building.desc, building.hotspots, "Pandangan Utama");
        };
        roomGrid.appendChild(mainBtn);

        // 2. Bina Butang Pilihan Bilik secara dinamik
        if (building.rooms) {
            for (const roomName in building.rooms) {
                if (building.rooms.hasOwnProperty(roomName)) {
                    const btn = document.createElement("button");
                    btn.className = "room-btn";
                    btn.innerText = roomName;
                    btn.onclick = function() {
                        const room = building.rooms[roomName];
                        update360View(roomName, room.img, room.desc, room.hotspots, roomName);
                    };
                    roomGrid.appendChild(btn);
                }
            }
        }

        // Cetus paparan pertama
        mainBtn.click();

    } else {
        document.getElementById("mainContent").innerHTML = `
            <h2>Data Tidak Ditemui</h2>
            <p>Sila pilih lokasi dari menu sub-kategori.</p>
            <a href="explore.html" class="map-btn">Kembali Ke Explore</a>
        `;
    }
</script>
